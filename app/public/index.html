<!doctype html>
<html lang="az" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Ofisi</title>
<meta name="description" content="Agent Ofisi: işçilərin canlı vəziyyəti, tapşırıq lövhəsi və ötürmələr.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f2c14e'/%3E%3Cpath d='M8 21l8-11 8 11z' fill='%2317130a'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('ofis-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <div class="brand"><span class="logo" aria-hidden="true"></span><b>Agent Ofisi</b><span id="live" class="live">bağlantı yoxdur</span></div>
  <div class="chips" id="chips" aria-live="polite"></div>
  <nav class="nav" aria-label="Bölmələr">
    <button class="btn" data-sheet="agents" aria-pressed="false"><span class="lbl">Agentlər</span><span class="sr-only">Agentlər</span></button>
    <button class="btn" data-sheet="board" aria-pressed="false"><span class="lbl">Lövhə</span><span class="sr-only">Lövhə</span></button>
    <button class="btn" data-sheet="journal" aria-pressed="false"><span class="lbl">Jurnal</span><span class="sr-only">Jurnal</span></button>
    <button class="btn" data-sheet="reports" aria-pressed="false"><span class="lbl">Hesabatlar</span><span class="sr-only">Hesabatlar</span></button>
    <button class="btn icon" id="theme" aria-label="Tünd / açıq rejim" title="Tünd / açıq rejim">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
    </button>
  </nav>
</header>

<main id="stage" aria-label="3D ofis">
  <canvas id="cv" role="img" aria-label="İzometrik 3D ofis: otaqlar, masalar və işçilər. İşçilərin siyahısı üçün Agentlər düyməsini aç."></canvas>
  <div id="labels"></div>
</main>

<div class="ctrl" role="toolbar" aria-label="Kamera">
  <button class="btn icon" id="rotL" aria-label="Sola fırlat" title="Sola fırlat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg></button>
  <button class="btn icon" id="rotR" aria-label="Sağa fırlat" title="Sağa fırlat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg></button>
  <button class="btn icon" id="zin" aria-label="Yaxınlaşdır" title="Yaxınlaşdır"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="btn icon" id="zout" aria-label="Uzaqlaşdır" title="Uzaqlaşdır"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button class="btn icon" id="reset" aria-label="Görünüşü sıfırla" title="Görünüşü sıfırla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 12h6M12 9v6"/></svg></button>
</div>
<aside id="activity" class="activity" aria-label="Kim nə edir" aria-live="polite"></aside>
<div class="hint">Sürüşdür: fırlat · Təkər: yaxınlaşdır · Sağ düymə: sürüşdür · İşçiyə bas: məlumat</div>

<aside id="panel" class="panel" hidden aria-label="İşçi paneli"></aside>
<section id="sheet" class="sheet" hidden aria-label="Bölmə"></section>
<div id="toast" role="status"></div>

<script src="/office.js"></script>
<script src="/app.js"></script>
</body>
</html>
